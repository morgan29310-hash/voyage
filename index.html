<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Voyage</title>
<meta name="theme-color" content="#12355b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-title" content="Voyage">

<style>
/* VOICE: calme, pratique, un carnet de route qu'on ouvre chaque soir.
   IDEA: la carte d'embarquement : un talon détachable avec le budget, des lignes perforées.
   PICTURE: la jauge du budget en grand + l'histogramme des dépenses par jour face à la ligne du budget quotidien.
   COLOUR and TYPE: papier clair, encre bleu pétrole #12355b, accent corail #e8553a ; police système, chiffres tabulaires.
   LAYOUT: une colonne sur téléphone, deux sur tablette ; en-tête fixe, sections en cartes perforées.
*/
:root{color-scheme:light dark;
--bg:light-dark(#f4f1ea,#0e1a26);--card:light-dark(#fffdf8,#152536);--ink:light-dark(#14212e,#e8eef4);
--mute:light-dark(#5d6a76,#9db0c2);--line:light-dark(#ddd6c8,#28405a);--pri:light-dark(#12355b,#7fb3e6);
--pri-ink:light-dark(#fff,#0e1a26);--acc:#e8553a;--ok:light-dark(#1f7a4d,#5fd39a);--warn:light-dark(#b56a00,#f0b44c);--bad:light-dark(#c0392b,#ff7a6b);
--soft:light-dark(#ebe5d8,#1c3046);--sun:#ffc857;--sea:#2a9d8f}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%;scroll-padding-top:72px}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 ui-rounded,"SF Pro Rounded","Nunito","Segoe UI",system-ui,-apple-system,Roboto,sans-serif;overflow-x:clip;padding-bottom:env(safe-area-inset-bottom)}
.num,td.n{font-variant-numeric:tabular-nums;white-space:nowrap}
header.top{position:sticky;top:0;z-index:5;background:linear-gradient(100deg,#12355b,#1d5b8c);color:var(--pri-ink);padding:10px max(4vw,14px);padding-top:max(10px,env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
header.top h1{font-size:19px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top button{background:transparent;color:inherit;border:1px solid color-mix(in srgb,currentColor 40%,transparent)}
main{max-width:1100px;margin:0 auto;padding:16px max(4vw,14px) calc(170px + env(safe-area-inset-bottom))}
h2{font-size:22px;line-height:1.15;margin:0 0 12px;text-wrap:balance}
h3{font-size:17px;margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 2px 0 var(--line),0 10px 30px -18px #12355b55;padding:16px;margin-bottom:16px;position:relative}
.perf{border-top:2px dashed var(--line);margin:14px -16px;position:relative}
.perf::before,.perf::after{content:"";position:absolute;top:-11px;width:20px;height:20px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.perf::before{left:-11px;clip-path:inset(0 0 0 50%)}.perf::after{right:-11px;clip-path:inset(0 50% 0 0)}
button,.btn{font:inherit;font-size:16px;min-height:44px;padding:8px 16px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
button.pri{background:var(--pri);color:var(--pri-ink);border-color:var(--pri);font-weight:600}
button.danger{color:var(--bad);border-color:currentColor;background:transparent}
button.link{border:0;background:none;color:var(--pri);padding:8px 4px;text-decoration:underline}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.chip:focus-within{outline:3px solid var(--acc);outline-offset:2px}
label{display:block;font-size:14px;color:var(--mute);margin:0 0 4px}
input,select,textarea{font:inherit;font-size:16px;width:100%;min-height:44px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
textarea{min-height:110px;font-size:14px}
.field{margin-bottom:12px}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr))}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;margin:0;min-height:0;cursor:pointer}
.chip span{display:inline-flex;align-items:center;min-height:40px;padding:6px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);font-size:15px}
.chip input:checked+span{background:var(--c,var(--pri));color:#fff;border-color:var(--c,var(--pri));font-weight:600;transform:translateY(-1px);box-shadow:0 4px 12px -4px var(--c,var(--pri))}
.chip span svg{width:20px;height:20px;margin-right:6px;flex:none}
.hero{position:relative;margin:-16px calc(-1*max(4vw,14px)) 18px;height:clamp(190px,34vw,280px);overflow:hidden;color:#fff}
.hero svg{position:absolute;inset:0;width:100%;height:100%}
.hero .txt{position:absolute;left:max(4vw,14px);right:max(4vw,14px);top:22px}
.hero h2{font-size:clamp(28px,6vw,44px);color:#12355b;margin:0;line-height:1.05}
.hero p{color:#12355b;margin:6px 0 0;font-size:16px;max-width:30ch}
.hero button{position:absolute;left:max(4vw,14px);bottom:16px;background:var(--acc);border-color:var(--acc);color:#fff;font-weight:700;box-shadow:0 6px 18px -6px #0006}
.trip{border-left:8px solid var(--tc,var(--pri))}
.stamp{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;padding:3px 10px;border-radius:999px;background:color-mix(in srgb,var(--tc,var(--pri)) 16%,transparent);color:var(--ink)}
.sec{display:flex;align-items:center;gap:10px;margin:6px 0 10px;font-size:18px;font-weight:700}
.sec i{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:12px;background:var(--c);color:#fff;flex:none}
.sec i svg{width:20px;height:20px}
.ring{width:clamp(96px,26vw,130px);height:auto;flex:none}
.budgetEdit button{min-height:40px;padding:6px 14px;font-size:15px;border-radius:999px}
.sumtop{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:14px;align-items:center}
.budgetEdit{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.budgetEdit input{width:140px}
.durinfo{background:var(--soft);border-radius:12px;padding:10px 14px;font-weight:600;margin-bottom:12px}
.ic{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:10px;color:#fff;margin-right:8px;vertical-align:middle;flex:none}.ic svg{width:17px;height:17px}
.fab{background:var(--acc)!important;border-color:var(--acc)!important;position:fixed;right:max(16px,env(safe-area-inset-right));bottom:calc(86px + env(safe-area-inset-bottom));z-index:6;border-radius:999px;min-height:56px;padding:0 22px;font-size:17px;box-shadow:0 6px 20px #12355b55}
@media(min-width:860px){.fab{display:none}}
.muted{color:var(--mute);font-size:14px}
.trip{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;cursor:pointer}
.trip:hover{border-color:var(--pri)}
.trip .name{font-size:20px;font-weight:700;line-height:1.2}
.bar{height:10px;border-radius:6px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;background:var(--pri);border-radius:6px}
.bar i.warn{background:var(--warn)}.bar i.bad{background:var(--bad)}
.big{font-size:clamp(34px,9vw,52px);font-weight:800;line-height:1.05;letter-spacing:-.5px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,140px),1fr));gap:10px;margin-top:12px}
.kpi{background:var(--bg);border-radius:10px;padding:10px 12px}
.kpi b{display:block;font-size:20px}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}
.layout{display:grid;gap:0 16px}
@media(min-width:860px){.layout{grid-template-columns:minmax(0,1.1fr) minmax(0,1fr)}.span2{grid-column:1/-1}}
.fig{position:relative;height:200px;margin-top:10px}.fig>svg{position:absolute;inset:0;width:100%;height:100%}
.cats{display:grid;gap:10px}
.cat{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 10px;font-size:15px}
.cat .bar{grid-column:1/-1}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:middle}
.exp{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:10px 4px;border-bottom:1px solid var(--line);cursor:pointer}
.exp:last-child{border-bottom:0}
.exp:hover{background:var(--soft)}
.exp small{color:var(--mute);font-size:13px}
.catgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.catgrid .chip span{width:100%;flex-direction:column;justify-content:center;border-radius:14px;min-height:64px;text-align:center;line-height:1.15;font-size:14px;gap:4px;background:color-mix(in srgb,var(--c) 10%,var(--bg));border-color:color-mix(in srgb,var(--c) 30%,var(--line))}
.catgrid .chip span svg{margin:0;width:22px;height:22px;color:var(--c)}.catgrid .chip input:checked+span svg{color:#fff}
.empty{text-align:center;padding:30px 10px;color:var(--mute)}
.toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;display:flex;gap:12px;align-items:center;z-index:20;max-width:92vw;box-shadow:0 6px 24px #0004}
.toast button{min-height:36px;padding:4px 12px;background:transparent;color:inherit;border-color:currentColor}
.hidden{display:none!important}
.pill{display:inline-block;font-size:13px;padding:2px 8px;border-radius:999px;background:var(--soft);color:var(--ink);margin:2px 4px 2px 0}
.rate{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center;margin-bottom:8px}
details summary{cursor:pointer;min-height:44px;display:flex;align-items:center;color:var(--pri);font-weight:600}
.countryRow{display:grid;grid-template-columns:minmax(0,1fr) 100px 44px;gap:8px;margin-bottom:8px}

.tabs{display:flex;gap:6px;background:var(--soft);padding:5px;border-radius:999px;margin:0 0 16px;max-width:420px}
.tabs button{flex:1;border:0;border-radius:999px;background:transparent;font-weight:700;min-height:44px}
.tabs button.on{background:var(--card);color:var(--pri);box-shadow:0 2px 8px -3px #0003}
.dayh{display:flex;align-items:baseline;gap:10px;margin:18px 0 8px;font-weight:800;font-size:18px}
.dayh small{font-weight:500;color:var(--mute);font-size:14px}
.dayh.today{color:var(--acc)}
.step{display:grid;grid-template-columns:62px minmax(0,1fr);gap:4px 12px;padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line);margin-bottom:10px}
button>svg{width:18px;height:18px;flex:none}
.trav{display:inline-block;font-size:13px;background:color-mix(in srgb,var(--sea) 15%,transparent);color:var(--ink);border-radius:999px;padding:2px 10px;margin-bottom:4px}
.nextdep{background:var(--pri);color:var(--pri-ink);border-radius:16px;padding:12px 16px;margin-bottom:12px}
.step .time{font-weight:800;font-size:17px;color:var(--pri);font-variant-numeric:tabular-nums}
.step .ttl{font-weight:700;font-size:17px;line-height:1.25}
.step .place{color:var(--mute);font-size:14px}
.step.done{opacity:.6}.step.done .ttl{text-decoration:line-through}
.step .acts{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.step .acts .btn,.step .acts button{min-height:40px;padding:6px 14px;font-size:15px;border-radius:999px;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.btn.go{background:var(--sea);border-color:var(--sea);color:#fff;font-weight:700}
.btn svg,.acts svg{width:18px;height:18px}
.thumbs{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;margin-top:4px}
.thumb{width:72px;height:72px;border-radius:12px;border:1px solid var(--line);background:var(--soft) center/cover no-repeat;display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--mute);cursor:pointer;position:relative;padding:0;min-height:0}
.thumb .x{position:absolute;top:-8px;right:-8px;width:26px;height:26px;border-radius:50%;background:var(--bad);color:#fff;border:0;font-size:14px;min-height:0;padding:0}
.sheet{position:fixed;inset:0;z-index:30;background:#0007;display:flex;align-items:flex-end;justify-content:center}
.sheet .in{background:var(--card);width:min(520px,100%);border-radius:22px 22px 0 0;padding:18px 16px calc(80px + env(safe-area-inset-bottom));display:grid;gap:10px}
.sheet .in h3{margin:0 0 2px}.sheet .in p{margin:0 0 6px;color:var(--mute);font-size:14px}
.sheet a{display:flex;align-items:center;gap:12px;min-height:56px;padding:8px 16px;border-radius:14px;border:1px solid var(--line);text-decoration:none;color:var(--ink);font-weight:700;font-size:17px;background:var(--bg)}
.sheet a small{display:block;font-weight:500;color:var(--mute);font-size:13px}
.sheet a i{display:grid;place-items:center;width:38px;height:38px;border-radius:12px;color:#fff;flex:none;font-style:normal}.sheet a i svg{width:22px;height:22px}
.viewer{position:fixed;inset:0;z-index:30;background:#000e;display:flex;flex-direction:column}
.viewer .vbar{display:flex;gap:10px;padding:10px;padding-top:max(10px,env(safe-area-inset-top));justify-content:space-between;align-items:center;color:#fff}
.viewer .vbar button{background:#fff2;color:#fff;border-color:#fff5}
.viewer .vimg{flex:1;overflow:auto;display:grid;place-items:center;touch-action:pinch-zoom pan-x pan-y}
.viewer img{max-width:100%;max-height:100%;background:#fff}

.seg{display:flex;gap:4px;background:var(--soft);padding:4px;border-radius:12px;margin:0 0 12px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;min-height:40px;font-size:15px;font-weight:600}
.seg button.on{background:var(--pri);color:var(--pri-ink)}
.nav{display:grid;grid-template-columns:48px minmax(0,1fr) 48px;gap:8px;align-items:center;margin-bottom:12px}
.nav button{padding:0;font-size:22px;font-weight:700}
.nav select{text-align:center;font-weight:700}
.nav .lbl{text-align:center;font-weight:800;font-size:17px}
.week{display:grid;gap:8px}
@media(min-width:760px){.week{grid-template-columns:repeat(7,minmax(0,1fr))}}
.wd{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;cursor:pointer;min-height:64px}
.wd.off{opacity:.45;cursor:default;background:transparent}
@media(max-width:759px){.wd.off{display:none}.wd{display:grid;grid-template-columns:88px minmax(0,1fr);gap:4px 10px;align-items:start}.wd h4{margin:0;flex-direction:column}}
.wd.today{border:2px solid var(--acc)}
.wd h4{margin:0 0 6px;font-size:14px;display:flex;justify-content:space-between;gap:6px}
.wd h4 span{color:var(--mute);font-weight:500}
.wi{font-size:14px;line-height:1.3;padding:4px 0 4px 8px;border-left:3px solid var(--sea);margin-bottom:5px}
.wi b{font-variant-numeric:tabular-nums;margin-right:4px}
.wi.done{opacity:.55;text-decoration:line-through}
.free{color:var(--mute);font-size:13px;font-style:italic}
@media(prefers-reduced-motion:no-preference){.bar i{transition:width .5s ease}.chip span{transition:transform .15s,box-shadow .15s}.hero .van{animation:roll 6s ease-in-out infinite alternate}@keyframes roll{from{transform:translateX(-14px)}to{transform:translateX(14px)}}}
</style>
</head>

const COUNTRIES={"France":"EUR","Allemagne":"EUR","Autriche":"EUR","Belgique":"EUR","Croatie":"EUR","Espagne":"EUR","Estonie":"EUR","Finlande":"EUR","Grèce":"EUR","Irlande":"EUR","Italie":"EUR","Lettonie":"EUR","Lituanie":"EUR","Luxembourg":"EUR","Malte":"EUR","Monaco":"EUR","Pays-Bas":"EUR","Portugal":"EUR","Slovaquie":"EUR","Slovénie":"EUR","Chypre":"EUR","Andorre":"EUR","Monténégro":"EUR","Kosovo":"EUR",

async function shrink(file){ // réduit les très grandes photos pour économiser la place (reste net pour lire un QR code)

  try{const bmp=await createImageBitmap(file);const M=2400,k=Math.min(1,M/Math.max(bmp.width,bmp.height));if(k===1&&file.size<1.5e6)return file;
    const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    return await new Promise(r=>c.toBlob(b=>r(b||file),'image/jpeg',.88))}catch(e){return file}}

function rateOf(cur){if(cur===HOME)return 1;const x=db.rates[cur];return x&&x.r>0?x.r:null}
async function refreshRates(force){

// ---------- Calculs ----------
function expHome(e){const r=e.rate||rateOf(e.cur);return r?e.amount/r:0}
// L'hébergement est réparti sur les nuits concernées (une nuit = le jour d'arrivée et les suivants)
const spanOf=e=>e.cat==='hebergement'&&e.nights>1?e.nights:1;
function shareOn(e,t,i){const i0=diffDays(e.date,t.start),n=spanOf(e);return i>=i0&&i<i0+n?expHome(e)/n:0}
function stats(t){
  const days=Math.max(1,t.days|0), daily=t.budget/days;
  const exps=t.expenses||[]; const spent=exps.reduce((s,e)=>s+expHome(e),0);
  const per=Array(days).fill(0); let outside=0;
  exps.forEach(e=>{const i0=diffDays(e.date,t.start),n=spanOf(e);for(let k=0;k<n;k++){const i=i0+k,v=expHome(e)/n;if(i>=0&&i<days)per[i]+=v;else outside+=v}});
  const ti=diffDays(todayISO(),t.start); const elapsed=Math.min(days,Math.max(0,ti+1));
  const byCat={};CATS.forEach(c=>byCat[c[0]]=0);exps.forEach(e=>byCat[e.cat]=(byCat[e.cat]||0)+expHome(e));
  const nights=exps.filter(e=>e.cat==='hebergement').reduce((s,e)=>s+(e.nights|0),0);
  const remaining=t.budget-spent, left=days-elapsed;
  const toDate=per.slice(0,elapsed).reduce((a,b)=>a+b,0);
  return {toDate,days,daily,spent,per,outside,elapsed,todayIndex:ti,byCat,nights,remaining,left,
    expected:daily*elapsed, perDayLeft:left>0?remaining/left:remaining};
}

    const end=t.end||addDays(t.start,s.days-1);const st=s.todayIndex<0?'À venir':s.todayIndex>=s.days?'Terminé':'En cours · jour '+(s.todayIndex+1);
    const cd=s.todayIndex<0?`Départ dans ${-s.todayIndex} j`:st;

  <p class="muted">Vos données restent sur cet appareil. Pensez à faire une sauvegarde (bouton en haut) pour les retrouver sur votre tablette.</p>`;
  const tg=$('#tGetHome');if(tg)tg.onclick=async()=>{tg.disabled=true;$('#tMsgHome').textContent='Récupération…';
    try{await fetchTransfer();toast('Voyages récupérés');renderList()}catch(e){$('#tMsgHome').textContent=e&&e.code==='aucun'?'Rien à récupérer : envoie d’abord tes voyages depuis l’appli dans Claude (Sauvegarde → Envoyer vers l’appli hors ligne).':(WERR[e&&e.code]||'Récupération impossible.');tg.disabled=false}};
  const wh=$('#wSyncHome');if(wh)wh.onclick=async()=>{wh.disabled=true;await widgetSync(true);wh.disabled=false;if(view.name==='list'&&db.widget.on)renderList()};

  $('#newTrip').onclick=nt; const n2=$('#newTrip2'); if(n2)n2.onclick=nt;
  document.querySelectorAll('.trip').forEach(el=>{const o=()=>go({name:'trip',id:el.dataset.id});el.onclick=o;el.onkeydown=e=>{if(e.key==='Enter')o()}});

// ---------- Page 2 : questions sur le voyage ----------
function renderEdit(){

   <div class="perf"></div>
   ${sec('#2a9d8f','<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>','Quand partez-vous ?')}
   <div class="grid">
     <div class="field"><label for="start">Date de départ</label><input id="start" type="date" value="${esc(t.start)}"></div>
     <div class="field"><label for="end">Date de retour</label><input id="end" type="date" value="${esc(t.end)}"></div>

   <div class="durinfo" id="dur">Choisissez la date de retour.</div>

  const dur=()=>{const a=$('#start').value,b=$('#end').value;if(!a||!b)return 0;const d=diffDays(b,a);return d>=0?d+1:-1};
  let autoN=!view.id||!t.nights||t.nights===((t.days|0)-1);
  const upd=()=>{const b=num($('#budget').value),d=dur();
    $('#dur').innerHTML=d>0?`Voyage de <b>${d} jour${d>1?'s':''}</b> et ${Math.max(0,d-1)} nuit${d>2?'s':''}`:d<0?'<span class="bad">La date de retour est avant le départ.</span>':'Choisissez la date de retour.';

  $('#f').onsubmit=e=>{e.preventDefault();
    const data={name:$('#name').value.trim(),start:$('#start').value,end:$('#end').value,budget:num($('#budget').value),days:dur(),nights:Math.round(num($('#nights').value)),
      countries:[...box.querySelectorAll('.countryRow')].map(r=>({name:r.querySelector('.cname').value.trim(),cur:r.querySelector('.ccur').value.trim().toUpperCase()})).filter(c=>c.name||c.cur),

      alloc:Object.fromEntries(CATS.map(c=>[c[0],num($('#a_'+c[0]).value)]))};
    const bad=!data.name?'Donnez un nom au voyage.':!data.start?'Indiquez la date de départ.':!data.end?'Indiquez la date de retour.':!(data.days>0)?'La date de retour doit être après le départ.':!(data.budget>0)?'Indiquez le budget total.':

    if(bad){$('#err').textContent=bad;return}
    if(view.id){Object.assign(t,data)}else{db.trips.push({id:uid(),expenses:[],...data})}
    save();const id=view.id||db.trips[db.trips.length-1].id;go({name:'trip',id});
    if(tripCurrencies(tripById(id)).some(c=>!rateOf(c)))refreshRates().then(ok=>ok&&render());
  };
}

// ---------- Page 3 : page principale du voyage ----------
function ringSVG(p,lv){const r=50,c=2*Math.PI*r,v=Math.min(100,Math.max(0,p));const col=lv==='bad'?'var(--bad)':lv==='warn'?'var(--warn)':'var(--sea)';
  return `<svg class="ring" viewBox="0 0 120 120" role="img" aria-label="${p.toFixed(0)} % du budget utilisé"><circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--soft)" stroke-width="12"/>
  <circle cx="60" cy="60" r="${r}" fill="none" stroke="${col}" stroke-width="12" stroke-linecap="round" stroke-dasharray="${c*v/100} ${c}" transform="rotate(-90 60 60)"/>
  <text x="60" y="58" text-anchor="middle" font-size="24" font-weight="800" fill="var(--ink)">${p.toFixed(0)} %</text><text x="60" y="78" text-anchor="middle" font-size="12" fill="var(--mute)">utilisé</text></svg>`}
let editing=null, dayPick=null;
const tabsHTML=t=>`<div class="tabs" role="tablist"><button role="tab" data-tab="budget" class="${view.tab!=='plan'?'on':''}">Budget</button><button role="tab" data-tab="plan" class="${view.tab==='plan'?'on':''}">Planning${(t.plan||[]).length?' ('+t.plan.length+')':''}</button></div>`;
const bindTabs=()=>document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{view.tab=b.dataset.tab;try{sessionStorage.setItem('bv.view',JSON.stringify(view))}catch(e){};editing=null;planEdit=null;renderTrip();window.scrollTo(0,0)});
function renderTrip(){
  const t=tripById(view.id); const s=stats(t);
  $('#title').textContent=t.name;
  if(view.tab==='plan')return renderPlan(t,s);
  const curs=tripCurrencies(t);
  const defDay=s.todayIndex>=0&&s.todayIndex<s.days?s.todayIndex:(s.todayIndex>=s.days?s.days-1:0);
  if(dayPick===null||dayPick.trip!==t.id)dayPick={trip:t.id,v:String(defDay)};
  const pct=t.budget?s.spent/t.budget*100:0; const lv=level(s.spent,t.budget);
  const pace=s.elapsed?s.toDate+s.outside-s.expected:0;
  const paceTxt=!s.elapsed?`Le voyage commence ${s.todayIndex===-1?'demain':'dans '+(-s.todayIndex)+' jours'}.`:
    Math.abs(pace)<1?'Vous êtes pile dans le rythme prévu.':pace>0?`<b class="bad">${money(pace)} au-dessus</b> du rythme prévu à ce jour.`:`<b class="ok">${money(-pace)} d'avance</b> sur le rythme prévu à ce jour.`;
  const missing=curs.filter(c=>!rateOf(c));
  const e=editing&&editing.trip===t.id?editing.e:null;
  const dayOpts=[...Array(s.days)].map((_,i)=>`<option value="${i}">Jour ${i+1} · ${fmtDate(addDays(t.start,i))}${i===s.todayIndex?' (aujourd’hui)':''}</option>`).join('')+'<option value="out">Hors dates (avant/après)</option><option value="all">Tout le voyage</option>';
  $('#app').innerHTML=`${tabsHTML(t)}<div class="layout">
  <section class="card span2" aria-label="État du budget">
    <div class="sumtop">
      <div><div class="muted">Reste à dépenser</div><div class="big num ${s.remaining<0?'bad':''}">${money(s.remaining,HOME,0)}</div>
        <div class="muted num">${money(s.spent)} dépensés sur <b style="color:var(--ink)">${money(t.budget)}</b></div></div>
      ${ringSVG(pct,lv)}</div>
      <div class="budgetEdit" id="bEdit"><button id="bOpen">Modifier le budget</button><button id="editTrip">Modifier le voyage</button></div>
    <p style="margin:10px 0 0">${paceTxt}</p>
    <div class="kpis">
      <div class="kpi"><span class="muted">Budget par jour</span><b class="num">${money(s.daily)}</b></div>
      <div class="kpi"><span class="muted">Moyenne dépensée / jour</span><b class="num ${level(s.elapsed?s.toDate/s.elapsed:0,s.daily)}">${s.elapsed?money(s.toDate/s.elapsed):'—'}</b></div>
      <div class="kpi"><span class="muted">Possible par jour restant</span><b class="num ${s.perDayLeft<0?'bad':''}">${s.left>0?money(s.perDayLeft):'—'}</b></div>
      <div class="kpi"><span class="muted">Jours</span><b class="num">${Math.max(0,s.elapsed)} / ${s.days}</b></div>
    </div>
    <div class="fig" id="chart" role="img" aria-label="Dépenses par jour comparées au budget quotidien"><svg></svg></div>
    <p class="muted" style="margin:4px 0 0"><span class="dot" style="background:var(--pri)"></span>Dépenses du jour <span class="dot" style="background:var(--acc);margin-left:10px"></span>Budget quotidien (${money(s.daily)})${s.outside?` · ${money(s.outside)} hors dates (billets payés avant, etc.)`:''}</p>
  </section>

  <section class="card" aria-label="Saisir une dépense">
    <h2>${e?'Modifier la dépense':'Ajouter une dépense'}</h2>
    <form id="ef" novalidate>
      <div class="catgrid" role="radiogroup" aria-label="Poste">${CATS.map(c=>`<label class="chip" style="--c:${c[2]}"><input type="radio" name="cat" value="${c[0]}" ${(e?e.cat:'repas')===c[0]?'checked':''}><span>${I(ICON[c[0]])}${c[1]}</span></label>`).join('')}</div>
      <div class="grid" style="margin-top:12px">
        <div class="field"><label for="amt">Montant</label><input id="amt" inputmode="decimal" placeholder="0,00" value="${e?String(e.amount).replace('.',','):''}"></div>
        <div class="field"><label for="cur">Devise</label><select id="cur">${curs.map(c=>`<option ${(e?e.cur:(curs[1]||HOME))===c?'selected':''}>${c}</option>`).join('')}</select></div>
        <div class="field"><label for="date">Date</label><input id="date" type="date" value="${e?e.date:(s.todayIndex>=0&&s.todayIndex<s.days?todayISO():addDays(t.start,defDay))}"></div>
        <div class="field" id="nightsF"><label for="enights">Nuits concernées</label><input id="enights" inputmode="numeric" value="${e&&e.nights?e.nights:''}" placeholder="1"></div>
      </div>
      <div class="field"><label for="note">Note (facultatif)</label><input id="note" value="${esc(e?e.note:'')}" placeholder="Ex. boulangerie, péage, musée…"></div>
      <p class="muted" id="conv"></p><p class="bad" id="eerr"></p>
      <div class="row"><button class="pri" type="submit">${e?'Enregistrer':'Ajouter'}</button>${e?'<button type="button" id="ecancel">Annuler</button><span style="flex:1"></span><button type="button" class="danger" id="edel">Supprimer</button>':''}</div>
    </form>
  </section>

  <section class="card" aria-label="Dépenses par jour">
    <h2>Dépenses au jour le jour</h2>
    <select id="dayPick" aria-label="Choisir le jour">${dayOpts}</select>
    <div id="dayBox"></div>
  </section>

  <section class="card" aria-label="Par poste">
    <h2>Par poste de dépenses</h2><div class="cats" id="cats"></div>
  </section>

  <section class="card" aria-label="Voyage et taux">
    <h2>Le voyage</h2>
    <div>${(t.countries||[]).map(c=>`<span class="pill">${esc(c.name||'?')} · ${esc(c.cur||'?')}</span>`).join('')}${(t.lodging||[]).map(v=>`<span class="pill">${esc(v)}</span>`).join('')}${(t.transport||[]).map(v=>`<span class="pill">${esc(v)}</span>`).join('')}</div>
    <p class="muted">du ${fmtDate(t.start)} au ${fmtDate(t.end||addDays(t.start,s.days-1))} · ${s.days} jours · ${t.nights|0} nuits · hébergement saisi pour <b>${s.nights}</b> / ${t.nights|0} nuits</p>
    ${curs.filter(c=>c!==HOME).length?`<div class="perf"></div><h3>Taux de change</h3>
    ${missing.length?`<p class="warn">Taux manquant pour ${missing.join(', ')} : connectez-vous à Internet puis touchez « Mettre à jour », ou saisissez-le.</p>`:''}
    ${curs.filter(c=>c!==HOME).map(c=>{const r=db.rates[c];return `<div class="rate"><span class="num">1 € =</span><input class="rateIn" data-c="${c}" inputmode="decimal" value="${r?String(+r.r.toPrecision(6)).replace('.',','):''}" placeholder="?" aria-label="Taux ${c}"><span>${c}</span></div><p class="muted" style="margin:-4px 0 10px">${r?(r.m?'Saisi à la main':'Mis à jour')+' le '+fmtDate(r.d):'Pas encore de taux'}</p>`}).join('')}
    <div class="row"><button id="upd">Mettre à jour les taux</button><span class="muted" id="updMsg"></span></div>`:''}
  </section></div>${e?'':'<button class="pri fab" id="fab">+ Dépense</button>'}`;
  bindTabs();
  const fab=$('#fab');if(fab)fab.onclick=()=>{$('#ef').scrollIntoView({behavior:'smooth',block:'start'});setTimeout(()=>$('#amt').focus({preventScroll:true}),350)};

  // Graphique
  const fig=$('#chart'),svg=fig.querySelector('svg');
  const draw=()=>{const W=fig.clientWidth,H=fig.clientHeight;if(!W)return;const pad={l:W<520?6:44,r:6,t:10,b:22};
    const max=Math.max(s.daily*1.3,...s.per,1);const bw=(W-pad.l-pad.r)/s.days;const y=v=>H-pad.b-(v/max)*(H-pad.t-pad.b);
    const sel=dayPick.v;
    let g=s.per.map((v,i)=>{const h=H-pad.b-y(v);const c=v>s.daily?'var(--acc)':'var(--pri)';return `<rect x="${pad.l+i*bw+bw*.15}" y="${y(v)}" width="${Math.max(1,bw*.7)}" height="${Math.max(0,h)}" rx="3" fill="${c}" opacity="${sel==i||sel==='all'||sel==='out'?1:.55}"/>`}).join('');
    const step=Math.ceil(s.days/(W<520?6:12));
    g+=s.per.map((_,i)=>i%step===0?`<text x="${pad.l+i*bw+bw/2}" y="${H-6}" font-size="12" text-anchor="middle" fill="var(--mute)">J${i+1}</text>`:'').join('');
    g+=`<line x1="${pad.l}" x2="${W-pad.r}" y1="${y(s.daily)}" y2="${y(s.daily)}" stroke="var(--acc)" stroke-width="2" stroke-dasharray="6 4"/>`;
    if(W>=520)g+=[0,max/2,max].map(v=>`<text x="${pad.l-6}" y="${y(v)+4}" font-size="12" text-anchor="end" fill="var(--mute)">${Math.round(v)}</text>`).join('');
    g+=s.per.map((v,i)=>`<rect x="${pad.l+i*bw}" y="0" width="${bw}" height="${H}" fill="transparent" data-i="${i}" style="cursor:pointer"><title>Jour ${i+1} : ${money(v)}</title></rect>`).join('');
    svg.innerHTML=g};
  const ro=new ResizeObserver(draw);ro.observe(fig);

  const dp=$('#dayPick');dp.value=dayPick.v;
  const drawDay=()=>{const v=dayPick.v;let list=t.expenses||[];
    if(v==='all'){}else if(v==='out')list=list.filter(x=>{const i=diffDays(x.date,t.start);return i<0||i>=s.days});else list=list.filter(x=>shareOn(x,t,+v)>0);
    list=[...list].sort((a,b)=>b.date.localeCompare(a.date)||(b.ts||0)-(a.ts||0));
    const part=x=>v==='all'||v==='out'?expHome(x):shareOn(x,t,+v);
    const tot=v==='out'?s.outside:list.reduce((a,x)=>a+part(x),0);const lim=v==='all'?t.budget:v==='out'?0:s.daily;

// ---------- Trajets & agenda ----------
const MODES=['À pied','Voiture','Transports en commun','Vélo','Taxi','Train','Avion','Bateau','Remontées mécaniques','Autre'];
const MODE_TXT={'À pied':'à pied','Voiture':'en voiture','Transports en commun':'en transports','Vélo':'à vélo','Taxi':'en taxi','Train':'en train','Avion':'en avion','Bateau':'en bateau','Remontées mécaniques':'en remontées','Autre':''};
function parseDur(v){if(v==null||v==='')return 0;if(typeof v==='number')return v<1?Math.round(v*1440):Math.round(v);
  const s=String(v).toLowerCase().trim();let m=s.match(/^(\d+)\s*h\s*(\d+)?/);if(m)return +m[1]*60+(+m[2]||0);
  m=s.match(/^(\d+):(\d{2})/);if(m)return +m[1]*60+ +m[2];m=s.match(/(\d+)/);return m?+m[1]:0}
const fmtDur=n=>n>=60?`${Math.floor(n/60)} h${n%60?' '+String(n%60).padStart(2,'0'):''}`:`${n} min`;
function matchMode(v){const n=norm(v);if(!n)return '';const f=MODES.find(m=>norm(m)===n||norm(m).startsWith(n)||n.startsWith(norm(m)));
  if(f)return f;if(/pied|marche/.test(n))return 'À pied';if(/voit|auto|fourgon|van/.test(n))return 'Voiture';if(/bus|metro|tram|transport/.test(n))return 'Transports en commun';return String(v).trim()}
const tmin=hhmm=>{const [h,m]=hhmm.split(':').map(Number);return h*60+m};
const hm=n=>{n=((n%1440)+1440)%1440;return String(Math.floor(n/60)).padStart(2,'0')+':'+String(n%60).padStart(2,'0')};
function departOf(x){return x.time&&x.travel>0?hm(tmin(x.time)-x.travel):''}
function travelTxt(x){if(!x.travel&&!x.mode)return '';return [x.travel?fmtDur(x.travel):'',MODE_TXT[x.mode]??(x.mode||'')].filter(Boolean).join(' ')}
function calTimes(x){ // l'évènement commence à l'heure de départ (pour que le rappel de l'agenda tombe avant de partir)
  const d=x.date.replace(/-/g,'');if(!x.time){const n=addDays(x.date,1).replace(/-/g,'');return {allDay:true,start:d,end:n}}
  let st=tmin(x.time)-(x.travel||0),en=tmin(x.time)+60;let sd=x.date;if(st<0){sd=addDays(x.date,-1);st+=1440}
  const f=(date,mn)=>date.replace(/-/g,'')+'T'+hm(mn).replace(':','')+'00';return {allDay:false,start:f(sd,st),end:f(en>=1440?addDays(x.date,1):x.date,en%1440)}}
function calDetails(x,t){return [x.travel?`Départ ${departOf(x)} · trajet ${travelTxt(x)} · sur place à ${x.time}`:'',x.note,(x.files||[]).length?`Tickets : dans l'appli Voyage (${t.name}).`:''].filter(Boolean).join('\n')}
function gcalUrl(x,t){const c=calTimes(x);const tz=Intl.DateTimeFormat().resolvedOptions().timeZone;
  return 'https://calendar.google.com/calendar/render?action=TEMPLATE&text='+encodeURIComponent(x.title)+'&dates='+c.start+'/'+c.end+(c.allDay?'':'&ctz='+encodeURIComponent(tz))+(x.place?'&location='+encodeURIComponent(x.place):'')+'&details='+encodeURIComponent(calDetails(x,t))}
function buildIcs(t){const e=s=>String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');
  const now=new Date().toISOString().replace(/[-:]/g,'').slice(0,15)+'Z';
  const ev=(t.plan||[]).map(x=>{const c=calTimes(x);return ['BEGIN:VEVENT','UID:'+x.id+'@budget-voyage','DTSTAMP:'+now,c.allDay?'DTSTART;VALUE=DATE:'+c.start:'DTSTART:'+c.start,c.allDay?'DTEND;VALUE=DATE:'+c.end:'DTEND:'+c.end,
    'SUMMARY:'+e(x.title),x.place?'LOCATION:'+e(x.place):'','DESCRIPTION:'+e(calDetails(x,t)),c.allDay?'':'BEGIN:VALARM\r\nACTION:DISPLAY\r\nDESCRIPTION:'+e('Départ : '+x.title)+'\r\nTRIGGER:-PT10M\r\nEND:VALARM','END:VEVENT'].filter(Boolean).join('\r\n')});
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Voyage//FR','CALSCALE:GREGORIAN',...ev,'END:VCALENDAR'].join('\r\n')}

async function unzip(buf){const d=new DataView(buf),u8=new Uint8Array(buf);let e=buf.byteLength-22;

    const name=dec.decode(u8.subarray(o+46,o+46+nl));const start=lo+30+d.getUint16(lo+26,true)+d.getUint16(lo+28,true);const data=u8.slice(start,start+cs);
    files[name]=async()=>m===0?dec.decode(data):await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text();
    o+=46+nl+el+cl}return files}

    const rels=P(await z['xl/_rels/workbook.xml.rels']());const r=tags(rels,'Relationship').find(x=>x.getAttribute('Id')===rid);
    if(r){let tg=r.getAttribute('Target');sheet=tg.startsWith('/')?tg.slice(1):'xl/'+tg.replace(/^\.\//,'')}}catch(e){}
  const ss=z['xl/sharedStrings.xml']?tags(P(await z['xl/sharedStrings.xml']()),'si').map(si=>tags(si,'t').map(t=>t.textContent).join('')):[];
  if(!z[sheet])throw new Error('sheet');
  const rows=[];for(const r of tags(P(await z[sheet]()),'row')){const row=[];
    for(const c of tags(r,'c')){const ref=c.getAttribute('r')||'';const col=[...ref.replace(/\d+/g,'')].reduce((a,ch)=>a*26+ch.charCodeAt(0)-64,0)-1;
      const t=c.getAttribute('t');const v=tags(c,'v')[0];let val=null;
      if(t==='s')val=ss[+v.textContent]??'';else if(t==='inlineStr')val=tags(c,'t').map(x=>x.textContent).join('');else if(t==='str'||t==='b'||t==='e')val=v?v.textContent:'';else if(v)val=+v.textContent;
      if(col>=0)row[col]=val}

  return [...rows].map(r=>r||[])}
function readCsv(txt){txt=txt.replace(/^\uFEFF/,'');const first=txt.split(/\r?\n/)[0];const dl=[';',',','\t'].sort((a,b)=>first.split(b).length-first.split(a).length)[0];
  const rows=[];let row=[],f='',q=false;for(let i=0;i<txt.length;i++){const c=txt[i];
    if(q){if(c==='"'){if(txt[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===dl){row.push(f);f=''}else if(c==='\n'||c==='\r'){if(c==='\r'&&txt[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}else f+=c}
  if(f||row.length){row.push(f);rows.push(row)}return rows}
const norm=x=>String(x??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().trim();
const COLS={date:['date','jour','day'],time:['heure','horaire','time','h'],title:['activite','activites','quoi','titre','etape','nom','evenement','programme','visite'],place:['adresse','lieu','destination','ou','address'],note:['note','notes','commentaire','commentaires','remarque','remarques','infos','info'],mode:['transport','moyen de transport','mode','mode de transport','transport pour y aller'],travel:['temps de trajet','trajet','duree','duree du trajet','duree trajet','temps de transport','temps']};
function xlDate(v){if(typeof v==='number'&&v>20000&&v<80000)return new Date(Date.UTC(1899,11,30)+Math.floor(v)*864e5).toISOString().slice(0,10);
  const s=String(v??'').trim();let m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);
  if(m){let y=+m[3];if(y<100)y+=2000;const d=new Date(Date.UTC(y,+m[2]-1,+m[1]));if(d.getUTCDate()===+m[1])return d.toISOString().slice(0,10)}

function xlTime(v,dateCell){const two=n=>String(n).padStart(2,'0');
  if(typeof v==='number'){const f=v-Math.floor(v);const mi=Math.round(f*1440)%1440;return `${two(Math.floor(mi/60))}:${two(mi%60)}`}
  let src=v;if((v==null||v==='')&&typeof dateCell==='number'&&dateCell%1>0)return xlTime(dateCell);
  const m=String(src??'').trim().match(/^(\d{1,2})\s*[:hH.]\s*(\d{2})?/);if(m&&+m[1]<24)return `${two(+m[1])}:${m[2]||'00'}`;return ''}
function parsePlanRows(rows,t){
  let hi=-1,map=null;

    const it={date,time:xlTime(g('time'),g('date')),title,place:txt('place'),note:txt('note'),mode:matchMode(g('mode')),travel:parseDur(g('travel'))};
    const key=it.date+'|'+it.time+'|'+norm(it.title);if(seen.has(key)){dup.push(line);return}seen.add(key);out.push(it)});
  return {items:out,bad,dup}}

// ---------- Planning ----------
let planImport=null, planEdit=null, planView={mode:'day',day:null,week:null,trip:null}; // {trip, item|null, files:[{id,name,type,size,blob?}] }
const GOICON=I('<path d="M3 11 21 3l-8 18-2-8-8-2Z"/>');
function renderPlan(t,s){

        ${k===s.todayIndex?'<div class="dayh today" style="margin-top:0">Aujourd’hui</div>':''}
        ${items.length?items.map(stepHTML).join(''):'<div class="card empty"><p>Rien de prévu ce jour-là : journée libre !</p></div>'}`}
    if(planView.mode==='week'){const w=planView.week;const ws=addDays(wk0,w*7);
      const cells=[...Array(7)].map((_,d)=>{const date=addDays(ws,d),i=diffDays(date,t.start),inTrip=i>=0&&i<s.days;
        const items=sortSteps(t.plan.filter(x=>x.date===date));
        return `<div class="wd ${inTrip?'':'off'} ${date===today?'today':''}" ${inTrip?`data-day="${i}" role="button" tabindex="0"`:''}>
          <h4>${new Date(date+'T12:00:00').toLocaleDateString('fr-FR',{weekday:'short',day:'numeric'})}<span>${inTrip?'J'+(i+1):''}</span></h4>
          <div>${items.map(x=>`<div class="wi ${x.done?'done':''}">${x.time?`<b>${esc(x.time)}</b>`:''}${esc(x.title)}</div>`).join('')||(inTrip?'<div class="free">Libre</div>':'')}</div></div>`}).join('');
      return seg+`<div class="nav"><button id="wPrev" aria-label="Semaine précédente" ${w===0?'disabled':''}>‹</button><div class="lbl">Semaine ${w+1}${nWeeks>1?' / '+nWeeks:''}<br><small class="muted" style="font-weight:500">${fmtDate(ws)} → ${fmtDate(addDays(ws,6))}</small></div><button id="wNext" aria-label="Semaine suivante" ${w>=nWeeks-1?'disabled':''}>›</button></div>
        <div class="week">${cells}</div><p class="muted">Touchez un jour pour voir le détail, les tickets et l’itinéraire.</p>`}
    return seg+order.map(k=>{const items=sortSteps(groups[k]);
      return `<div class="dayh ${k===s.todayIndex?'today':''}">${k==='out'?'Hors dates du voyage':'Jour '+(k+1)}<small>${k==='out'?'':fmtDate(addDays(t.start,k))+(k===s.todayIndex?' · aujourd’hui':'')}</small></div>${items.map(stepHTML).join('')}`}).join('')};
  const groups={};t.plan.forEach(x=>{const k=dayOf(x.date);(groups[k]=groups[k]||[]).push(x)});
  const order=[...Array(s.days).keys()].filter(i=>groups[i]).concat(groups.out?['out']:[]);
  const dayOpts=[...Array(s.days)].map((_,i)=>{const d=addDays(t.start,i);return `<option value="${d}">Jour ${i+1} · ${fmtDate(d)}</option>`}).join('');
  const defDate=it?it.date:(planView.trip===t.id&&planView.mode==='day'&&planView.day!=='out'&&planView.day!=null?addDays(t.start,planView.day):(s.todayIndex>=0&&s.todayIndex<s.days?todayISO():t.start));
  const form=pe?`<section class="card" id="pf"><h2>${it?'Modifier l’étape':'Nouvelle étape'}</h2><form id="pform" novalidate>
    <div class="field"><label for="pTitle">Quoi ?</label><input id="pTitle" value="${esc(it?it.title:'')}" placeholder="Ex. Visite de l’Alhambra"></div>
    <div class="grid"><div class="field"><label for="pDate">Jour</label><select id="pDate">${dayOpts}<option value="${esc(defDate)}" ${dayOf(defDate)==='out'?'':'hidden'}>${fmtDate(defDate)}</option></select></div>
      <div class="field"><label for="pTime">Heure (facultatif)</label><input id="pTime" type="time" value="${esc(it?it.time||'':'')}"></div></div>
    <div class="grid"><div class="field"><label for="pMode">Pour y aller</label><select id="pMode"><option value="">—</option>${MODES.map(m=>`<option ${it&&it.mode===m?'selected':''}>${m}</option>`).join('')}${it&&it.mode&&!MODES.includes(it.mode)?`<option selected>${esc(it.mode)}</option>`:''}</select></div>
      <div class="field"><label for="pTravel">Temps de trajet (min)</label><input id="pTravel" inputmode="numeric" value="${it&&it.travel?it.travel:''}" placeholder="Ex. 20"></div></div>
    <p class="muted" id="pDep" style="margin-top:-4px"></p>
    <div class="field"><label for="pPlace">Adresse ou lieu (pour l’itinéraire)</label><input id="pPlace" value="${esc(it?it.place||'':'')}" placeholder="Ex. Alhambra, Grenade"></div>
    <div class="field"><label for="pNote">Note (facultatif)</label><input id="pNote" value="${esc(it?it.note||'':'')}" placeholder="Ex. arriver 15 min avant, réservation n°…"></div>
    <div class="field"><label>Tickets et réservations (photos ou PDF)</label><div class="thumbs" id="pThumbs" style="margin-bottom:8px"></div>
      <label class="btn" style="display:inline-flex;align-items:center;gap:8px;cursor:pointer;color:var(--ink);font-size:16px;margin:0">${I('<path d="M21 12.5 12.5 21a5 5 0 0 1-7-7L14 5.5a3.3 3.3 0 0 1 4.7 4.7L10.2 18.7a1.7 1.7 0 0 1-2.4-2.4L15.5 8.6"/>')}Joindre un ticket<input type="file" id="pFile" accept="image/*,application/pdf" multiple style="display:none"></label></div>
    <p class="bad" id="perr"></p>
    <div class="row"><button class="pri" type="submit">${it?'Enregistrer':'Ajouter au planning'}</button><button type="button" id="pCancel">Annuler</button>${it?'<span style="flex:1"></span><button type="button" class="danger" id="pDel">Supprimer</button>':''}</div>
  </form></section>`:'';
  const fileThumb=(f,removable)=>`<button type="button" class="thumb" data-f="${f.id}" title="${esc(f.name)}">${f.type.startsWith('image/')?'':'PDF'}${removable?`<span class="x" data-rm="${f.id}" aria-label="Retirer">✕</span>`:''}</button>`;
  const stepHTML=x=>`<div class="step ${x.done?'done':''}" data-id="${x.id}">
    <div class="time">${esc(x.time||'—')}</div>
    <div>${travelTxt(x)?`<div class="trav">${x.travel&&x.time?`Départ <b>${departOf(x)}</b> · `:''}${esc(travelTxt(x))}</div>`:''}<div class="ttl">${esc(x.title)}</div>${x.place?`<div class="place">${esc(x.place)}</div>`:''}${x.note?`<div class="place">${esc(x.note)}</div>`:''}</div>
    ${(x.files||[]).length?`<div class="thumbs">${x.files.map(f=>fileThumb(f,false)).join('')}</div>`:''}
    <div class="acts">${x.place?`<button class="btn go" data-go="${x.id}">${GOICON}Y aller</button>`:''}
      <a class="btn" href="${gcalUrl(x,t)}" target="_blank" rel="noopener">${I('<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M12 13v5M9.5 15.5h5"/>')}Agenda</a>
      <button data-done="${x.id}">${x.done?'Pas fait':'Fait ✓'}</button><button data-edit="${x.id}">Modifier</button></div></div>`;
  $('#app').innerHTML=`${tabsHTML(t)}${form}
    <section aria-label="Planning">${planBody()}
    </section>${pe?'':'<button class="pri fab" id="pAdd" style="display:block">+ Étape</button>'}`;
  bindTabs();
  const rp=()=>renderPlan(t,s);
  const on2=(id,fn)=>{const el=$(id);if(el)el.onclick=fn};
  document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{planView.mode=b.dataset.mode;rp()});
  const impF=$('#impFile');if(impF)impF.onchange=async()=>{const f=impF.files[0];impF.value='';if(!f)return;
    try{const buf=await f.arrayBuffer();let rows;
      if(/\.xlsx$/i.test(f.name)||new Uint8Array(buf.slice(0,2)).join()==='80,75')rows=await readXlsx(buf);
      else if(/\.xls$/i.test(f.name))throw new Error('xls');
      else{let txt=new TextDecoder('utf-8').decode(buf);if(txt.includes('\uFFFD'))txt=new TextDecoder('windows-1252').decode(buf);rows=readCsv(txt)}
      planImport={trip:t.id,name:f.name,...parsePlanRows(rows,t)};rp();window.scrollTo(0,0)}
    catch(e){toast(e.message==='xls'?'Ancien format .xls : enregistrez le fichier en .xlsx ou .csv':'Impossible de lire ce fichier. Utilisez le modèle Excel (.xlsx) ou un .csv.')}};
  on2('#impNo',()=>{planImport=null;rp()});
  on2('#icsBtn',async()=>{const ics=buildIcs(t);const name=(t.name||'voyage').replace(/[^\w\- ]+/g,'').trim().replace(/\s+/g,'-')+'.ics';const f=new File([ics],name,{type:'text/calendar'});
    try{if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:t.name});return}}catch(e){if(e.name==='AbortError')return}
    const a=document.createElement('a');a.href=blobUrl(f);a.download=name;document.body.appendChild(a);a.click();a.remove();toast('Fichier agenda téléchargé')});
  on2('#impOk',()=>{const n=planImport.items.length;const ids=new Set();planImport.items.forEach(x=>{const id=uid()+ids.size;ids.add(id);t.plan.push({id,done:false,files:[],...x})});
    const first=[...planImport.items].sort((a,b)=>a.date.localeCompare(b.date))[0];planImport=null;
    if(first){const di=diffDays(first.date,t.start);if(s.todayIndex<0||s.todayIndex>=s.days){planView.day=di>=0&&di<s.days?di:'out'}planView.week=null}
    save();rp();toast(n+' étape'+(n>1?'s':'')+' ajoutée'+(n>1?'s':'')+' au planning',()=>{t.plan=t.plan.filter(x=>!ids.has(x.id));save();rp()})});
  const on=(id,fn)=>{const el=$(id);if(el)el.onclick=fn};
  on('#dPrev',()=>{planView.day--;rp()});on('#dNext',()=>{planView.day++;rp()});
  const ds=$('#dSel');if(ds)ds.onchange=()=>{planView.day=ds.value==='out'?'out':+ds.value;rp()};
  on('#wPrev',()=>{planView.week--;rp()});on('#wNext',()=>{planView.week++;rp()});
  document.querySelectorAll('.wd[data-day]').forEach(el=>{const o=()=>{planView.mode='day';planView.day=+el.dataset.day;rp();window.scrollTo(0,0)};el.onclick=o;el.onkeydown=k=>{if(k.key==='Enter')o()}});
  // vignettes des pièces jointes
  const thumbsFor=async(root,files)=>{for(const f of files){const el=root.querySelector(`[data-f="${f.id}"]`);if(!el)continue;
    const b=f.blob||await idb.get(f.id).catch(()=>null);if(b&&f.type.startsWith('image/'))el.style.backgroundImage=`url(${blobUrl(b)})`;
    el.onclick=async ev=>{if(ev.target.dataset.rm)return;openFile(f,f.blob||await idb.get(f.id).catch(()=>null))}}};
  t.plan.forEach(x=>{const el=document.querySelector(`.step[data-id="${x.id}"]`);if(el&&x.files)thumbsFor(el,x.files)});
  document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{const x=t.plan.find(y=>y.id===b.dataset.go);const q=encodeURIComponent(x.place);
    const gm=m=>`https://www.google.com/maps/dir/?api=1&destination=${q}&travelmode=${m}`;
    const opt=(href,col,ic,l,sub)=>`<a href="${href}" target="_blank" rel="noopener"><i style="background:${col}">${I(ic)}</i><span>${l}<small>${sub}</small></span></a>`;
    const sh=document.createElement('div');sh.className='sheet';sh.innerHTML=`<div class="in" role="dialog" aria-label="Choisir l’application"><h3>Y aller avec…</h3><p>${esc(x.place)}</p>
      ${opt(`https://waze.com/ul?q=${q}&navigate=yes`,'#33ccff','<path d="M5 17h14l-2-7a5 5 0 0 0-10 0Z"/><circle cx="8" cy="19" r="2"/><circle cx="16" cy="19" r="2"/>','Waze','En voiture')}
      ${opt(gm('walking'),'#2a9d8f','<circle cx="13" cy="4" r="2"/><path d="M10 21l2-6-3-3 2-5 4 4h3M9 12H6"/>','Google Maps','À pied')}
      ${opt(gm('transit'),'#1d5b8c','<rect x="5" y="3" width="14" height="14" rx="3"/><path d="M5 10h14M8 17l-2 4M16 17l2 4"/>','Google Maps','En transports en commun')}
      ${opt(gm('driving'),'#e8553a','<path d="M3 11 21 3l-8 18-2-8-8-2Z"/>','Google Maps','En voiture')}
      <button id="shClose">Annuler</button></div>`;
    const close=()=>sh.remove();sh.onclick=ev=>{if(ev.target===sh||ev.target.closest('a'))close()};sh.querySelector('#shClose').onclick=close;document.body.appendChild(sh)});
  document.querySelectorAll('[data-done]').forEach(b=>b.onclick=()=>{const x=t.plan.find(y=>y.id===b.dataset.done);x.done=!x.done;save();renderPlan(t,s)});
  document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const x=t.plan.find(y=>y.id===b.dataset.edit);planEdit={trip:t.id,item:x,files:(x.files||[]).map(f=>({...f}))};renderPlan(t,s);window.scrollTo({top:0,behavior:'smooth'})});
  const add=$('#pAdd');if(add)add.onclick=()=>{planEdit={trip:t.id,item:null,files:[]};renderPlan(t,s);window.scrollTo(0,0);setTimeout(()=>{const x=$('#pTitle');x&&x.focus()},100)};
  if(!pe)return;
  $('#pDate').value=defDate;
  const dep=()=>{const x={time:$('#pTime').value,travel:parseDur($('#pTravel').value),mode:$('#pMode').value};$('#pDep').textContent=x.time&&x.travel?`Départ conseillé à ${departOf(x)} (${travelTxt(x)}).`:x.travel?'Indiquez l’heure pour calculer l’heure de départ.':''};
  ['#pTime','#pTravel','#pMode'].forEach(id=>{$(id).addEventListener('input',dep);$(id).addEventListener('change',dep)});dep();
  const drawThumbs=()=>{const box=$('#pThumbs');if(!box)return;box.innerHTML=pe.files.map(f=>fileThumb(f,true)).join('');thumbsFor(box,pe.files);
    box.querySelectorAll('[data-rm]').forEach(x=>x.onclick=ev=>{ev.stopPropagation();pe.files=pe.files.filter(f=>f.id!==x.dataset.rm);drawThumbs()})};
  drawThumbs();
  $('#pFile').onchange=ev=>{const list=[...ev.target.files];ev.target.value='';pe.busy=(async()=>{await pe.busy;for(const file of list){const b=await shrink(file);pe.files.push({id:uid(),name:file.name,type:b.type||file.type,size:b.size,blob:b})}drawThumbs()})()};
  $('#pCancel').onclick=()=>{planEdit=null;renderPlan(t,s)};
  const del=$('#pDel');if(del)del.onclick=async()=>{if(!del.dataset.c){del.dataset.c=1;del.textContent='Confirmer la suppression';return}
    for(const f of it.files||[])await idb.del(f.id).catch(()=>{});t.plan.splice(t.plan.indexOf(it),1);planEdit=null;save();renderPlan(t,s);toast('Étape supprimée')};
  $('#pform').onsubmit=async ev=>{ev.preventDefault();await pe.busy;const title=$('#pTitle').value.trim();if(!title){$('#perr').textContent='Donnez un nom à l’étape.';return}
    try{for(const f of pe.files)if(f.blob){await idb.put(f.id,f.blob)}}catch(e){$('#perr').textContent='Impossible d’enregistrer le fichier (espace plein ?).';return}
    const keep=new Set(pe.files.map(f=>f.id));for(const f of (it&&it.files)||[])if(!keep.has(f.id))await idb.del(f.id).catch(()=>{});
    const data={title,date:$('#pDate').value,time:$('#pTime').value,mode:$('#pMode').value,travel:parseDur($('#pTravel').value),place:$('#pPlace').value.trim(),note:$('#pNote').value.trim(),files:pe.files.map(({blob,...f})=>f)};
    if(it)Object.assign(it,data);else t.plan.push({id:uid(),done:false,...data});
    const di=diffDays(data.date,t.start);planView.day=di>=0&&di<s.days?di:'out';planView.week=null;
    planEdit=null;save();renderPlan(t,s);toast(it?'Étape modifiée':'Ajouté au planning')};
}

// ---------- Sauvegarde / transfert ----------
function renderBackup(){
  $('#title').textContent='Sauvegarde';
  const fileIds=allFileIds();const build=buildBackup;
  const wOn=db.widget&&db.widget.on;
  const wInfo=W.msg||(wOn?(db.widget.at?'Dernière synchro : '+new Date(db.widget.at).toLocaleString('fr-FR',{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}):'Activée'):'Désactivée');
  $('#app').innerHTML=`<section class="card"><h2>Widget téléphone</h2>
   <p>Le widget affiche le budget et le programme des 3 prochains jours, avec vos billets. Pour cela, l’appli copie un petit résumé et les billets dans votre Google Drive (dossier « Voyage – widget »), à chaque modification.</p>
   <div class="row"><button class="pri" id="wSync">${wOn?'Synchroniser maintenant':'Activer le widget'}</button>${wOn?'<button id="wOff">Désactiver</button>':''}</div>
   <p id="wStat" class="${W.state==='err'?'bad':'muted'}" role="status">${esc(wInfo)}</p></section>
   ${STANDALONE?`<section class="card"><h2>Récupérer mes voyages</h2><p>Importe les voyages et billets envoyés depuis l’appli Voyage ouverte dans Claude.</p><div class="row"><button class="pri" id="tGet">Récupérer mes voyages</button></div><p id="tMsg" class="muted" role="status"></p></section>`
     :`<section class="card"><h2>Appli hors ligne</h2><p>Envoie tous tes voyages, dépenses et billets vers ton Google Drive, pour les récupérer dans l’appli installée qui marche sans internet.</p><div class="row"><button class="pri" id="tSend">Envoyer vers l’appli hors ligne</button></div><p id="tMsg" class="muted" role="status"></p></section>`}
   <section class="card"><h2>Sauvegarder ou transférer vos voyages</h2>
   <p>Les données sont enregistrées uniquement sur cet appareil. Pour les copier sur votre tablette (ou les mettre à l'abri), exportez un fichier puis importez-le sur l'autre appareil.</p>
   <div class="row"><button class="pri" id="dl">Télécharger le fichier</button><button id="cp">Copier le texte</button><button id="shr" class="${navigator.share?'':'hidden'}">Partager…</button></div>
   <p class="muted">${db.trips.length} voyage(s), ${db.trips.reduce((a,t)=>a+(t.expenses||[]).length,0)} dépense(s), ${db.trips.reduce((a,t)=>a+(t.plan||[]).length,0)} étape(s) de planning, ${fileIds.length} ticket(s) joint(s) (inclus dans la sauvegarde).</p>
   <div class="perf"></div>
   <h3>Importer</h3>
   <p class="muted">Les voyages importés s'ajoutent ; un voyage déjà présent est remplacé par la version importée.</p>
   <div class="field"><label for="file">Depuis un fichier</label><input type="file" id="file" accept=".json,application/json,text/plain"></div>
   <div class="field"><label for="paste">Ou collez le texte</label><textarea id="paste" placeholder='{"trips":[...]}'></textarea></div>
   <div class="row"><button id="imp">Importer le texte collé</button><span id="impMsg" class="muted"></span></div></section>`;
  const tSend=$('#tSend');if(tSend)tSend.onclick=async()=>{tSend.disabled=true;$('#tMsg').textContent='Envoi en cours… (garde l’appli ouverte)';
    try{const n=await sendTransfer();$('#tMsg').textContent='Envoyé ('+Math.round(n/1024)+' Ko). Ouvre maintenant l’appli installée et touche « Récupérer mes voyages ».';toast('Voyages envoyés')}
    catch(e){$('#tMsg').textContent=e&&e.code==='too_big'?'Trop volumineux pour cet envoi : utilise « Copier le texte » ci-dessous.':(WERR[e&&e.code]||'Envoi impossible ('+(e&&e.code||'erreur')+').')}tSend.disabled=false};
  const tGet=$('#tGet');if(tGet)tGet.onclick=async()=>{tGet.disabled=true;$('#tMsg').textContent='Récupération…';
    try{const n=await fetchTransfer();$('#tMsg').textContent=n+' voyage(s) récupéré(s).';toast('Voyages récupérés')}
    catch(e){$('#tMsg').textContent=e&&e.code==='aucun'?'Rien à récupérer : envoie d’abord tes voyages depuis l’appli dans Claude.':(WERR[e&&e.code]||'Récupération impossible.')}tGet.disabled=false};
  $('#wSync').onclick=async()=>{await widgetSync(true);if(view.name==='backup')renderBackup()};
  const wOff=$('#wOff');if(wOff)wOff.onclick=()=>{db.widget.on=false;persist();W.msg='';renderBackup();toast('Synchro du widget désactivée')};
  const name='voyage-sauvegarde-'+todayISO()+'.json';
  $('#dl').onclick=async()=>{const json=await build();try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([json],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();toast('Fichier téléchargé')}catch(e){toast('Téléchargement impossible ici : utilisez « Copier le texte »')}};
  $('#cp').onclick=async()=>{const json=await build();try{await navigator.clipboard.writeText(json);toast('Copié')}catch(e){$('#paste').value=json;$('#paste').select();toast('Sélectionnez et copiez le texte ci-dessous')}};
  $('#shr').onclick=async()=>{const json=await build();try{const f=new File([json],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:"Voyage - sauvegarde"});else await navigator.share({text:json})}catch(e){}};
  const doImport=async txt=>{try{const n=await importBackup(JSON.parse(txt));$('#impMsg').textContent=n+' voyage(s) importé(s).';toast('Import réussi')}catch(e){$('#impMsg').textContent='Ce texte ne ressemble pas à une sauvegarde valide.'}};
  $('#imp').onclick=()=>doImport($('#paste').value);
  $('#file').onchange=ev=>{const f=ev.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>doImport(r.result);r.readAsText(f)};
}

// ---------- Démarrage ----------
render();
if(db.widget.on&&db.widget.dirty)setTimeout(()=>widgetSync(false),3000);
if(navigator.onLine){const age=db.ratesAt?Date.now()-new Date(db.ratesAt):Infinity;if(age>12*36e5)refreshRates().then(ok=>ok&&view.name==='trip'&&!editing&&render())}
window.addEventListener('online',()=>refreshRates().then(ok=>ok&&view.name==='trip'&&!editing&&render()));
if('serviceWorker' in navigator&&location.protocol==='https:'){navigator.serviceWorker.register('sw.js').catch(()=>{})}
}
</script>
</body>
</html>
